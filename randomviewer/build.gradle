plugins {
    id 'com.android.application'
}

// GitHub Actions の実行番号をバージョンにする（ローカルビルドは 1）
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.sukepuu.randomviewer'
    compileSdk 35

    // CI でビルドするたびに署名が変わると上書きインストールできないため、
    // リポジトリに置いた固定のデバッグ用キーで署名する（個人利用のみ・公開しない前提）
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.sukepuu.randomviewer'
        minSdk 28
        targetSdk 35
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
